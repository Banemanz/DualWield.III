name: Cleanup DualWieldIII

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean release baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = Path('DualWieldIII_v7_V3Baseline_SkinBonesCompat.cpp')
          if not old.exists():
              raise SystemExit('versioned source not found')

          s = old.read_text()
          start = s.index('/*')
          end = s.index('*/', start) + 2
          header = '''/*
              DualWieldIII
              Dual-wield backport for classic GTA III 1.0 EN.

              The native weapon remains untouched. The second weapon is a standalone
              RpAtomic on a private root frame, kept outside the player ped clump for
              compatibility with skinned/HAnim skeleton and ragdoll/render mods.

              Stock PC RwFrame and Skin & Bones/Xbox HAnim skeletons use separate pose
              backends. Colt .45/Uzi second shots reuse GTA III's native CWeapon::Fire
              path so muzzle flash, smoke, light and shell effects remain native.
          */'''
          s = header + s[end:]

          s = s.replace('DualWieldIII v7:', 'DualWieldIII:')
          s = s.replace('DualWieldIII v7 summary:', 'DualWieldIII summary:')
          s = s.replace('DualWieldIII_v7_V3Baseline_SkinBonesCompat.log', 'DualWieldIII.log')
          s = s.replace('ApplyCurrentV3Mirror', 'ApplyCurrentMirror')
          s = s.replace('v7 owns both of these objects independently.', 'DualWieldIII owns both of these objects independently.')
          s = s.replace('v3 behavior, but with an explicit Skin & Bones backend:', 'Use the finished native arm pose with the Skin & Bones backend when needed:')
          s = s.replace('used by v3; only the source of handWorld differs for stock vs skinned peds.', 'used by the mirror path; only the source of handWorld differs for stock vs skinned peds.')
          s = s.replace('The v2 code could leave', 'Direct matrix writes could leave')
          s = s.replace("v3's successful look", 'the working mirror approach')
          s = s.replace('Apply the v3 mirror', 'Apply the arm mirror')
          s = s.replace('v3 render-stage mirror active', 'render-stage mirror active')
          s = s.replace('v7 ', '')

          # Drop the noisy startup/debug-only logging while preserving compatibility warnings.
          for line in [
              '            Log("DualWieldIII: render bridge installation deferred until gameProcess so Skin & Bones / shader startup hooks settle first.");\n\n',
              '            Log("DualWieldIII: second weapon uses standalone RpAtomic rendering; it is never inserted into the player ped clump.");\n',
              '            Log("DualWieldIII: stock RwFrame and Skin & Bones/Xbox HAnim skeletons use separate pose backends; skinned m_apFrames[*].m_pFrame is never treated as RwFrame.");\n',
              '            Log("DualWieldIII: no CPedIK call-site patch is installed; Skin & Bones may keep ownership of its replacement IK functions.");\n',
              '            Log("DualWieldIII: crash 0x5B1791 is RpHAnimHierarchyUpdateMatrices(NULL); standalone rendering avoids exposing the weapon atomic to external ped HAnim walkers.");\n',
          ]:
              s = s.replace(line, '')

          s = s.replace('            LoadConfig();\n\n            const bool fireOk', '            LoadConfig();\n            Log("DualWieldIII: initialized.");\n\n            const bool fireOk')

          Path('DualWieldIII.cpp').write_text(s)
          old.unlink()
          Path('V7_NOTES.txt').unlink(missing_ok=True)
          Path('CLEANUP_PENDING.txt').unlink(missing_ok=True)

          Path('DualWieldIII.ini').write_text('''[DualWield]
; Master switch.
Enabled=1

; Supported one-handed firearms.
Colt45=1
Uzi=1

; Fire both weapons through GTA III's native CWeapon::Fire path.
DoubleShot=1

; Mirror the stock firing-arm pose onto the opposite arm.
LeftArmIK=1

; Chain compatible existing CALL hooks from other ASIs.
ChainExistingCallHooks=1

; Small aim-state hysteresis to prevent one-frame snapping.
AimGraceFrames=2

; Short blend-in for the mirrored arm pose. 0/1 = immediate.
AimBlendFrames=3

; Local grip correction for the second weapon.
OffsetX=0.040
OffsetY=-0.050
OffsetZ=0.000
RotationX=180.000
RotationY=0.000
RotationZ=0.000
''')

          Path('README.md').write_text('''# DualWield.III

Dual-wield backport for classic **Grand Theft Auto III 1.0 EN**.

Supports the Colt .45 and Uzi with a second visible weapon, dual firing, native muzzle effects, and mirrored opposite-arm aiming.

The second weapon is rendered as a standalone `RpAtomic` outside the player ped clump. Both the stock PC `RwFrame` skeleton and Skin & Bones/Xbox HAnim skeletons are supported, with compatibility safeguards for ragdoll/render mods.

Configuration is in `DualWieldIII.ini`.
''')

          Path('.github/workflows/cleanup.yml').unlink(missing_ok=True)
          PY

          git config user.name "Banemanz"
          git config user.email "46337867+Banemanz@users.noreply.github.com"
          git add -A
          git commit -m "Clean up DualWieldIII release baseline"
          git push
