name: Finalize DualWieldIII source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collapse source and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          cat \
            src/DualWieldIII_01.inc \
            src/DualWieldIII_02.inc \
            src/DualWieldIII_03.inc \
            src/DualWieldIII_04.inc \
            src/DualWieldIII_05.inc \
            > DualWieldIII.cpp

          if grep -Eqi 'v7|V3Baseline|SkinBonesCompat|DualWieldIII_v7' DualWieldIII.cpp; then
            echo 'Versioned development branding remains in source.' >&2
            exit 1
          fi
          grep -F 'BuildSiblingPath(gLogPath, sizeof(gLogPath), "DualWieldIII.log")' DualWieldIII.cpp >/dev/null

          rm -rf src
          rm -f .github/workflows/finalize.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "Banemanz"
          git config user.email "46337867+Banemanz@users.noreply.github.com"
          git add -A
          git commit -m "Finalize DualWieldIII source layout"
          git push
