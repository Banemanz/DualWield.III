[DualWield]
; Master switch.
Enabled=1

; GTA III's on-foot one-handed bullet weapons.
Colt45=1
Uzi=1

; 1 = each native attack fire event shoots the stock gun, then the opposite gun through
; GTA III's original CWeapon::Fire path (two bullets / two ammo when available).
; 0 = visual dual wield + dual-arm aim only; damage/ammo remains one native shot.
DoubleShot=1

; Keeps the v3 render-stage mirrored-arm behavior. v7 adds a separate HAnim backend
; for Skin & Bones/Xbox skinned peds rather than changing the actual v3 aiming style.
LeftArmIK=1

; Existing ASIs may already own the CPed::Attack fire CALL or CPed::Render's final CALL.
; 1 = chain a valid executable target. Recommended with Skin & Bones / Proper Shaders.
; 0 = require the exact stock GTA III 1.0 EN target.
ChainExistingCallHooks=1

; Tiny aim-state hysteresis. Prevents a one-frame GTA flag drop from snapping the twin arm.
; 0 disables it. Values above 8 are clamped to 8.
AimGraceFrames=2

; Gentle aim-in ramp applied to the v3 mirrored direction. At full blend the geometry is
; exactly the v3 mirror; this is NOT the v4/v5 TargetIK solver. 0/1 = immediate v3 pose.
; Values above 8 are clamped to 8.
AimBlendFrames=3

; Second weapon grip correction. The duplicate weapon is a standalone atomic and is
; never inserted into the player's ped clump. These values are local to the twin weapon.
OffsetX=0.040
OffsetY=-0.050
OffsetZ=0.000
RotationX=180.000
RotationY=0.000
RotationZ=0.000
