[DualWield]
Enabled=1
Colt45=1
Uzi=1
DoubleShot=1
LeftArmIK=1
ChainExistingCallHooks=1

; Keep the working forward-move aim continuity and full vertical pitch behavior.
AimHoldFrames=4
AimBlendFrames=1
AimPoseBlend=1.000
FirePoseBlend=1.000
LateProcessRepair=0

; v21 uses the same successful geometry as the newer VC build: mirror the native
; shoulder->elbow and elbow->hand segment directions across Claude's sagittal plane.
; That naturally gives the twin elbow the correct opposite-side arch while both guns
; stay aimed forward. Leave this at 0 for the VC-style pose. 1-3 adds extra flare only.
ElbowOutwardDeg=0.000

; Stable bind-pose-derived opposite-hand grip socket.
CopyNativeGripBasis=1

; Full hand stabilization is intentional while aiming/firing. These are safety caps,
; not the old dynamic socket selector.
StabilizeSecondHand=1
HandAimBlend=1.000
HandAimLimitDeg=90.000
StabilizeSecondHandRoll=1
HandRollBlend=1.000
HandRollLimitDeg=90.000

LogHandState=0
HandStateLogInterval=60

; Optional weapon-local fine trim. Start at zero: the bind-derived socket should put
; the weapon at the same actual hand origin Skin & Bones uses for the stock gun.
OffsetX=0.000
OffsetY=0.000
OffsetZ=0.000
RotationX=0.000
RotationY=0.000
RotationZ=0.000
