[DualWield]
; Master switch.
Enabled=1

; Supported one-handed firearms.
Colt45=1
Uzi=1

; Fire both weapons through GTA III's native CWeapon::Fire path.
DoubleShot=1

; Mirror the stock firing-arm pose onto the opposite arm.
LeftArmIK=1

; Chain compatible existing CALL hooks from other ASIs.
ChainExistingCallHooks=1

; Small aim-state hysteresis to prevent one-frame snapping.
AimGraceFrames=2

; Short blend-in for the mirrored arm pose. 0/1 = immediate.
AimBlendFrames=3

; Local grip correction for the second weapon.
OffsetX=0.040
OffsetY=-0.050
OffsetZ=0.000
RotationX=180.000
RotationY=0.000
RotationZ=0.000
